    <style>
    *{
        margin: 0;
        padding: 0;
        font-family: 'Google Sans Flex', sans-serif;
    }
    body{
        display: block;
        height: 100vh;
        padding-bottom: 130px;
        box-sizing: border-box;
        background-color: #F2ECE8;
        background-attachment: fixed;
        background-size: 40px 40px;
        background-image:
        linear-gradient(to right, #232323 1px, transparent 1px),
        linear-gradient(to bottom, #232323 1px, transparent 1px);
    }
    .rectangle-stack{
        position: relative;
        width: calc(100% - 260px);
        margin: 30px auto 0;
    }
    .rectangle{
        position: absolute;
        inset: 0;
        border: 2px solid #DB393C;
        background-color: #F2ECE8;
        box-sizing: border-box;
    }
    .rectangle-back{
        transform: translate(20px, 20px);
    }
    .rectangle-front{
        position: relative;
        inset: auto;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
    }
    .intro-text{
        max-width: 720px;
        font-weight: 400;
        color: #DB393C;
    }
    .behance-embed{
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    .embed-stack{
        position: relative;
        width: calc(100% - 260px);
        aspect-ratio: 16 / 9;
        margin: 65px auto 0;
    }
    .link-grid{
        display: grid;
        grid-template-columns: repeat(4, 80px);
        grid-auto-rows: 80px;
        gap: 65px;
        width: max-content;
        margin: 65px auto 0;
    }
    .link-square{
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 80px;
        height: 80px;
        border: 2px solid #DB393C;
        background-color: #F2ECE8;
        box-sizing: border-box;
    }
    .link-square:hover{
        background-color: #232323;
    }
    .link-square img{
        display: block;
        width: 80px;
        height: 80px;
    }
    .link-item{
        position: relative;
        width: 80px;
        height: 80px;
    }
    .link-background{
        position: absolute;
        inset: 0;
        border: 2px solid #DB393C;
        background-color: #F2ECE8;
        box-sizing: border-box;
        transform: translate(20px, 20px);
    }
    footer{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 65px;
        margin-top: 130px;
        color: #F2ECE8;
        background-color: #DB393C;
        text-align: center;
    }
    @media (max-width: 700px){
        body{
            overflow-x: hidden;
        }
        .rectangle-stack,
        .embed-stack{
            width: calc(100% - 40px);
        }
        .rectangle-back,
        .link-background{
            transform: translate(10px, 10px);
        }
        .rectangle-front{
            padding: 20px;
        }
        .behance-embed{
            height: 100%;
        }
        .link-grid{
            grid-template-columns: repeat(2, 64px);
            grid-auto-rows: 64px;
            gap: 36px 28px;
        }
        .link-item,
        .link-square,
        .link-square img{
            width: 64px;
            height: 64px;
        }
        footer{
            margin-top: 90px;
        }
    }
    </style>
</head>
